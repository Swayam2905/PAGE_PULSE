[project]
name = "page-pulse"
version = "1.0.0"
description = "A small web tool that audits any URL — HTTP status, response time, page title, meta description, H1 count, images missing alt text, and word count."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",
    "beautifulsoup4==4.12.3",
    "pydantic==2.9.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]