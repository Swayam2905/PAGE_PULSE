<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Pulse — URL Auditor</title>
<style>
  :root{
    --bg:#0b1020;
    --panel:#141b2e;
    --panel-border:#252f4a;
    --accent:#4f8cff;
    --good:#3ecf8e;
    --warn:#f5a524;
    --bad:#f5544a;
    --text:#e7ecff;
    --muted:#93a0c2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at top, #16203a 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:48px 24px 16px;
    text-align:center;
  }
  header h1{
    margin:0 0 8px;
    font-size:2.2rem;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:1rem;
  }
  main{
    flex:1;
    max-width:720px;
    margin:0 auto;
    width:100%;
    padding:24px;
  }
  form{
    display:flex;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:10px;
    border-radius:14px;
  }
  input[type="text"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:1rem;
    padding:10px 12px;
  }
  input[type="text"]::placeholder{color:var(--muted);}
  button{
    background:var(--accent);
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.9;}
  button:disabled{opacity:.5;cursor:default;}

  #status{
    margin-top:14px;
    font-size:0.9rem;
    color:var(--muted);
    min-height:1.2em;
  }

  #error-box{
    display:none;
    margin-top:20px;
    padding:16px 18px;
    background:rgba(245,84,74,0.1);
    border:1px solid rgba(245,84,74,0.4);
    border-radius:12px;
    color:#ffb4ae;
  }

  #report{
    display:none;
    margin-top:24px;
  }
  .report-url{
    color:var(--muted);
    font-size:0.85rem;
    word-break:break-all;
    margin-bottom:16px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:12px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:14px 16px;
  }
  .card .label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .card .value{
    font-size:1.4rem;
    font-weight:700;
  }
  .card.full{
    grid-column:1 / -1;
  }
  .card .value.small{
    font-size:1rem;
    font-weight:500;
    word-break:break-word;
  }
  .pill{
    display:inline-block;
    padding:2px 10px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
  }
  .pill.good{background:rgba(62,207,142,0.15);color:var(--good);}
  .pill.warn{background:rgba(245,165,36,0.15);color:var(--warn);}
  .pill.bad{background:rgba(245,84,74,0.15);color:var(--bad);}

  footer{
    text-align:center;
    padding:24px;
    color:var(--muted);
    font-size:0.85rem;
  }
  footer a{color:var(--accent);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
</style>
</head>
<body>

<header>
  <h1>📡 Page Pulse</h1>
  <p>Paste any URL. Get an instant health report.</p>
</header>

<main>
  <form id="audit-form">
    <input type="text" id="url-input" placeholder="example.com or https://example.com" autocomplete="off" />
    <button type="submit" id="submit-btn">Audit</button>
  </form>
  <div id="status"></div>

  <div id="error-box"></div>

  <div id="report">
    <div class="report-url" id="report-url"></div>
    <div class="grid" id="report-grid"></div>
  </div>
</main>

<footer>
  Built for Digital Heroes Training Task &middot;
  <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
</footer>

<script>
const form = document.getElementById('audit-form');
const input = document.getElementById('url-input');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('error-box');
const report = document.getElementById('report');
const reportUrl = document.getElementById('report-url');
const reportGrid = document.getElementById('report-grid');

function resetUI(){
  errorBox.style.display = 'none';
  errorBox.textContent = '';
  report.style.display = 'none';
  reportGrid.innerHTML = '';
}

function statusPill(code){
  if (!code) return '';
  if (code < 300) return '<span class="pill good">' + code + ' OK</span>';
  if (code < 400) return '<span class="pill warn">' + code + ' Redirect</span>';
  return '<span class="pill bad">' + code + ' Error</span>';
}

function card(label, valueHtml, full=false, small=false){
  const div = document.createElement('div');
  div.className = 'card' + (full ? ' full' : '');
  div.innerHTML = `<div class="label">${label}</div><div class="value${small ? ' small' : ''}">${valueHtml}</div>`;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = input.value.trim();
  if (!url) return;

  resetUI();
  submitBtn.disabled = true;
  statusEl.textContent = 'Fetching and analyzing…';

  try {
    const res = await fetch('/api/audit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });

    const data = await res.json();

    if (!res.ok) {
      // FastAPI HTTPException shape: {detail: "..."}
      throw new Error(data.detail || 'Something went wrong.');
    }

    statusEl.textContent = '';

    if (data.error) {
      errorBox.textContent = data.error;
      errorBox.style.display = 'block';
      // still show whatever partial data we have (status/time), if present
      if (data.status_code || data.response_time_ms) {
        reportUrl.textContent = data.url;
        reportGrid.appendChild(card('HTTP Status', statusPill(data.status_code) || '—'));
        reportGrid.appendChild(card('Response Time', (data.response_time_ms ?? '—') + ' ms'));
        report.style.display = 'block';
      }
      return;
    }

    reportUrl.textContent = data.url;
    reportGrid.appendChild(card('HTTP Status', statusPill(data.status_code)));
    reportGrid.appendChild(card('Response Time', (data.response_time_ms ?? '—') + ' ms'));
    reportGrid.appendChild(card('H1 Count', data.h1_count ?? '—'));
    reportGrid.appendChild(card('Word Count', (data.word_count ?? '—').toLocaleString ? data.word_count.toLocaleString() : data.word_count));
    reportGrid.appendChild(card('Images Missing Alt', `${data.images_missing_alt ?? '—'} / ${data.total_images ?? '—'}`));
    reportGrid.appendChild(card('Page Title', data.title || '(none found)', true, true));
    reportGrid.appendChild(card('Meta Description', data.meta_description || '(none found)', true, true));

    report.style.display = 'block';

  } catch (err) {
    statusEl.textContent = '';
    errorBox.textContent = err.message || 'Unexpected error. Please try again.';
    errorBox.style.display = 'block';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
